*{

  margin:0;

}

body{

  background:#ffffff;
  color:#17351f;
  line-height:1.9;
}

header{

nav{

  gap:28px;
  padding:14px 10px;
  box-shadow:0 2px 10px #0002;
  position:sticky;
  top:0;
  z-index:20;
}

nav a{
  text-decoration:none;
  color:#17351f;
  font-weight:bold;
}

nav a:hover{
  color:#c9152b;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.breaking{
  background:#c9152b;

  padding:13px 18px;
  border-radius:12px;
  margin-bottom:28px;

}

.title{
  font-size:24px;

  padding-right:12px;
  margin:25px 0 18px;
  color:#087a3b;
}

.hero{
  background:#ffffff;
  color:#17351f;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:30px;
  box-shadow:0 5px 20px #0002;
  border-top:5px solid #087a3b;
}

.hero-image{
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
  background:linear-gradient(135deg,#087a3b,#c9152b);
}

.hero-content{
  padding:24px;
}

.hero h2{
  font-size:27px;
  margin:8px 0;
  color:#c9152b;
}

.tag{
  display:inline-block;
  background:#e8f5ed;
  color:#087a3b;
  padding:3px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:#ffffff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 14px #0001;
  transition:.2s;
  border-bottom:4px solid #087a3b;
}

.card:hover{
  transform:translateY(-3px);
}

.thumb{

  background:linear-gradient(135deg,#087a3b,#c9152b);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  color:#ffffff;
}

.card-body{
  padding:17px;
}

.card h3{
  font-size:18px;
  margin:7px 0;
  color:#c9152b;
}
